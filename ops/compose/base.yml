name: ledgerly

# Always on: Postgres with pgvector and Redis. The Laravel app, Horizon and Reverb run on the host with `php artisan` (Chapters 0 and 18).
# Every published port is bound to 127.0.0.1: nothing in this directory is reachable from another machine.
# Paths are relative to this directory, which is the project directory for `docker compose -f ops/compose/base.yml ...` and for the root compose.yaml.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ledgerly}
      POSTGRES_USER: ${DB_USERNAME:-ledgerly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sidecar:
    profiles: ["sidecar"]
    build: ../../sidecar
    ports:
      - "127.0.0.1:${SIDECAR_PORT:-8008}:8000"
    networks: [sidecar]
    environment:
      SIDECAR_RERANK_MODEL: ${SIDECAR_RERANK_MODEL:-BAAI/bge-reranker-base}
    volumes:
      - sidecar-models:/home/sidecar/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # Chapter 27: Python beside PHP. Both services are in the `python` profile (naming them in `up` also starts them). Neither is given a database credential from here:
  # py-worker gets Redis and nothing else, py-listen is the PHP side that owns every write. Both sit on the project's default network, where Postgres and Redis are.
  #   docker compose --env-file .env -f ops/compose/base.yml --profile python up -d --build py-worker py-listen
  py-worker:
    profiles: ["python"]
    image: ledgerly-training:${TRAINING_TAG:-vol2}
    build:
      context: ../../training
    command: ["uv", "run", "python", "-m", "workers.embed_worker"]
    environment:
      REDIS_URL: redis://redis:6379/0                         # no database credentials
      NOMIC_REVISION: ${NOMIC_REVISION:-e9b6763023c676ca8431644204f50c2b100d9aab}
      NOMIC_CODE_REVISION: ${NOMIC_CODE_REVISION:-7710840340a098cfb869c4f65e87cf2b1b70caca}
      TASK_TIMEOUT_MS: ${TASK_TIMEOUT_MS:-120000}
      EMBED_MODELS_DIR: /models/embeddings                        # Chapter 46: a model tune_embeddings.py wrote is served by its directory's name
    volumes:
      - py-models:/home/worker/.cache/huggingface
      - ../../training/runs/embeddings:/models/embeddings:ro      # read-only: the worker serves these, it never changes them
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/py-worker.heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s                                       # the first start downloads the model
    restart: unless-stopped

  py-listen:
    profiles: ["python"]
    image: ${APP_IMAGE:-ledgerly/app:vol2}
    build:
      context: ../..
      dockerfile: ops/app/Dockerfile
    command: ["php", "artisan", "py:listen", "--stream=py:results"]
    env_file:
      - ../../.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318     # Chapter 31: used only when OTEL_PHP_AUTOLOAD_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "py:status"]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

networks:
  sidecar: {}
  internal: {}                 # where the model servers live (ollama.yml, llama.yml); they publish nothing beyond 127.0.0.1

volumes:
  postgres-data:
  redis-data:
  sidecar-models:
  py-models:
