# Chapter 31, Figure 31-9. Receive OTLP, delete anything that says it holds customer content, batch, forward to Jaeger.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  attributes/strip-content:
    actions:
      - { pattern: "^gen_ai\\.(prompt|completion|input|output)\\..*", action: delete }   # Topic 2, enforced
      - { pattern: "^ledgerly\\.content\\..*", action: delete }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-content, batch]
      exporters: [otlp/jaeger]
