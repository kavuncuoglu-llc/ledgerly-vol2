# Profile: llama (Chapter 23). llama-server beside Ollama, behind the same driver: the `local-llama` provider.
#   ./ops/llama/pull.sh                                    # fetch the GGUF into ./models (once)
#   docker compose --env-file .env -f ops/compose/base.yml -f ops/compose/llama.yml --profile llama up -d --build
# CPU image by default (LLAMA_VARIANT=cpu). For an NVIDIA GPU set LLAMA_VARIANT=cuda and add  -f ops/compose/llama.gpu.yml
#
# The flags are Figure 23-5's, with their values in .env. LLAMA_API_KEY has no default and the file refuses to start without one:
# llama-server has the bearer auth Ollama lacks, and an empty key would turn it off. The port is published on 127.0.0.1 only (the app runs on the host);
# a container on the `internal` network reaches it at http://llama:8080/v1.
# Do not put this file in the root compose.yaml: the required key would stop `docker compose up -d` for everyone who does not use llama-server.

services:
  llama:
    profiles: ["llama"]
    image: ledgerly/llama-server:${LLAMA_VARIANT:-cpu}-${LLAMA_TAG:-b11829}
    build:
      context: ../llama
      dockerfile: Dockerfile.${LLAMA_VARIANT:-cpu}
      args:
        LLAMA_TAG: ${LLAMA_TAG:-b11829}
    command:
      - "-m"
      - "/models/${LLAMA_MODEL_FILE:-ledgerly-support-q4_k_m.gguf}"
      - "-c"
      - "${LLAMA_CTX:-32768}"
      - "-np"
      - "${LLAMA_PARALLEL:-4}"
      - "-ngl"
      - "${LLAMA_NGL:-99}"
      - "-fa"
      - "${LLAMA_FLASH_ATTN:-on}"
      - "-ctk"
      - "${LLAMA_CACHE_TYPE:-q8_0}"
      - "-ctv"
      - "${LLAMA_CACHE_TYPE:-q8_0}"
      - "-ub"
      - "${LLAMA_UBATCH:-512}"
      - "--cache-reuse"
      - "256"
      - "--metrics"
      - "--api-key"
      - "${LLAMA_API_KEY:?Set LLAMA_API_KEY in .env (for example: openssl rand -hex 24). llama-server without a key is open to anyone who can reach it.}"
      # Speculative decoding (Topic 7): after `./ops/llama/pull.sh draft`, append
      #   "-md", "/models/llama-3.2-1b-instruct-q8_0.gguf", "--spec-draft-n-max", "12"
      # CPU profile (Figure 23-8): LLAMA_MODEL_FILE=gemma-3-4b-it-q6_k.gguf LLAMA_CTX=16384 LLAMA_PARALLEL=2 LLAMA_NGL=0, and add "-t", "8", "-tb", "16"
    networks:
      internal:
        aliases: [llama]
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ../../models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
