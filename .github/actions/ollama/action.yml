# Chapter 29, Figure 29-9: "restore the Ollama model cache; pull the model". The container is started by this step rather than as a job service, so the model
# directory can be a restored cache and the pull is skipped when the cache is warm.
name: Ollama with a cached model directory
description: Starts a pinned Ollama container on 127.0.0.1:11434 and pulls the named models.
inputs:
  image:
    description: The pinned Ollama image, for example ollama/ollama:0.40.12
    required: true
  models:
    description: Space-separated model names to pull
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v6.0.0
      with:
        path: ~/.ollama-cache
        key: ollama-${{ inputs.image }}-${{ inputs.models }}
    - name: Start Ollama
      shell: bash
      env:
        OLLAMA_IMAGE: ${{ inputs.image }}
      run: |
        mkdir -p "$HOME/.ollama-cache"
        docker run -d --name ollama -v "$HOME/.ollama-cache:/root/.ollama" -p 127.0.0.1:11434:11434 "$OLLAMA_IMAGE"
        curl -sf --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:11434/api/version > /dev/null
    - name: Pull the models (a warm cache makes this a no-op)
      shell: bash
      env:
        OLLAMA_MODELS: ${{ inputs.models }}
      run: |
        for model in $OLLAMA_MODELS; do
          docker exec ollama ollama pull "$model"
        done
